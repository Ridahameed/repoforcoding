<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital clock timer</title>
    <link rel="stylesheet" href="js_project_1.css">
</head>

<body>
    <h1>Digital Clock</h1>
    <div class="clock">
        <div>
            <span id="hour">00</span>
            <span class="text">Hours</span>
        </div>
        <div>
            <span id="min">00</span>
            <span class="text">Minutes</span>
        </div>
        <div>
            <span id="sec">00</span>
            <span class="text">Seconds</span>
        </div>
        <div>
            <span id="am_pm">AM</span>
        </div>
    </div>
    <script src="js_project_1.js"></script>
</body>

</html>
