<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="js_assignment 1.css">
</head>

<body>
    <div class="container">
        <h1>To-Do-List</h1>
        <div id="input-container">
            <input type="text" id="taskInput" placeholder="Enter a new task" maxlength="35">
            <button id="addTaskButton">Add Task</button>
        </div>
        <ul id="taskList"></ul>
        <button id="deleteAllBtn" class="delete-All-Btn">Delete all</button>
        <button id="removeComplete">Remove complete Task</button>
    </div>

    <script src="js_assignment 1.js"></script>
</body>

</html>
