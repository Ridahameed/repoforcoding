<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors name</title>
    <style>
        #screen {
            background-color: rgb(214, 214, 138);
            height: 100px;
            width: 200px;
            border: solid 1px black;
            margin: 100px 0 0 200px;
            text-align: center;
            padding-top: 50px;
        }
        #red {
            background-color: red;
            height: 50px;
            width: 50px;
        }
        #blue{
            background-color: blue;
            height: 50px;
            width: 50px;
        }
        #green{
            background-color: green;
            height: 50px;
            width: 50px;
        }
        #yellow{
            background-color: yellow;
            height: 50px;
            width: 50px;
            
        }
        #colors{
            height: 200px;
            width: 200px;
            border: solid 1px black;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 30px;
            place-items: center;
            margin: 2px 0 0 200px;

        }
    </style>
</head>

<body>
    <div id="screen"></div>
    <div id="colors">
        <div id="red" onclick="red()"></div>
        <div id="blue" onclick="blue()"></div>
        <div id="green" onclick="green()"></div>
        <div id="yellow" onclick="yellow()"></div>
    </div>
    <script src="js practice 4.js"></script>
</body>

</html>
