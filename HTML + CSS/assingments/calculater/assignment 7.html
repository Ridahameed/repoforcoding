<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
    <link rel="stylesheet" href="assignment 7.css">
    <script src="assignment 7.js"></script>
</head>

<body>
    <div class="calculater">
        <div class="screen" id="screen">0</div>
        <!-- first row -->
        <div class="btn lightgray" onclick="clean()">Ac</div>
        <div class="btn lightgray" onclick="del()">⌫</div>
        <div class="btn lightgray" onclick="appendOperator('%')">%</div>
        <div class="btn orange" onclick="appendOperator('/')">÷</div>
        <!-- second row -->
        <div class="btn darkgray" onclick="appendNumber('7')">7</div>
        <div class="btn darkgray" onclick="appendNumber('8')">8</div>
        <div class="btn darkgray" onclick="appendNumber('9')">9</div>
        <div class="btn orange" onclick="appendOperator('*')">x</div>
        <!-- third row -->
        <div class="btn darkgray" onclick="appendNumber('4')">4</div>
        <div class="btn darkgray" onclick="appendNumber('5')">5</div>
        <div class="btn darkgray" onclick="appendNumber('6')">6</div>
        <div class="btn orange" onclick="appendOperator('-')">-</div>
        <!-- fourth row -->
        <div class="btn darkgray" onclick="appendNumber('1')">1</div>
        <div class="btn darkgray" onclick="appendNumber('2')" >2</div>
        <div class="btn darkgray" onclick="appendNumber('3')">3</div>
        <div class="btn orange" onclick="appendOperator('+')">+</div>
        <!-- fifth row -->
        <div class="zero" onclick="appendNumber('0')">0</div>
        <div class="btn darkgray" onclick="appendOperator('.')">.</div>
        <div class="btn orange" onclick="calculate()">=</div>
    </div>

</body>

</html>
