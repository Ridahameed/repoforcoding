<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
    <link rel="stylesheet" href="assignment 7.css">
</head>

<body>
    <div class="calculater">
        <div class="screen">0</div>
        <!-- first row -->
        <div class="btn lightgray">Ac</div>
        <div class="btn lightgray">⌫</div>
        <div class="btn lightgray">%</div>
        <div class="btn orange">÷</div>
        <!-- second row -->
        <div class="btn darkgray">7</div>
        <div class="btn darkgray">8</div>
        <div class="btn darkgray">9</div>
        <div class="btn orange">x</div>
        <!-- third row -->
        <div class="btn darkgray">4</div>
        <div class="btn darkgray">5</div>
        <div class="btn darkgray">6</div>
        <div class="btn orange">-</div>
        <!-- fourth row -->
        <div class="btn darkgray">1</div>
        <div class="btn darkgray">2</div>
        <div class="btn darkgray">3</div>
        <div class="btn orange">+</div>
        <!-- fifth row -->
        <div class="zero">0</div>
        <div class="btn darkgray">,</div>
        <div class="btn orange">=</div>
    </div>

</body>

</html>
